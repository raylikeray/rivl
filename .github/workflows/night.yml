name: Night
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Days of games to read (2 to 10). To rebuild from opening night, delete data/night-state.json.'
        required: false
        default: '2'
  push:
    branches: [main]
    paths: [scripts/night.mjs, .github/workflows/night.yml]
concurrency: { group: night-data }   # its own line: a waiting run in the shared group is dropped when another data job queues behind it
jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/night.mjs
        env:
          BACKFILL: ${{ inputs.backfill || '2' }}
      - name: Save
        run: |
          git config user.name "rivl-bot"
          git config user.email "bot@rivl"
          git add data/night.json data/night-state.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Night: update"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break || sleep $((i*5)); done
