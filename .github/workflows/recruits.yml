name: Recruit rankings
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/recruits.yml']
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/prepranks.mjs
      - run: node scripts/prephoops.mjs
      - run: |
          git config user.name "RIVL bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Recruit rankings: daily update"
          git pull --rebase -q && git push
