name: Probe
on: { push: { branches: [probe-stand] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -s 'https://site.api.espn.com/apis/v2/sports/basketball/mens-college-basketball/standings?group=50&level=3' -o out/m.json
          curl -s 'https://site.api.espn.com/apis/v2/sports/basketball/womens-college-basketball/standings?group=50&level=3' -o out/w.json
          curl -s 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams?groups=50&limit=400' -o out/mt.json
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: stand, path: out }
