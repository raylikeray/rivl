name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://www.unrivaled.basketball
          for p in schedule standings stats clubs game/1eww6736sf9v; do curl -sSL -m 30 -A "Mozilla/5.0" "$B/$p" -o "$(echo $p | tr / _).html"; done
          G=$(grep -o 'href="/game/[^"]*"' schedule.html | head -1 | cut -d'"' -f2); echo $G
          ls -la
      - uses: actions/upload-artifact@v4
        with: { name: out, path: out }
