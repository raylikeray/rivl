name: Probe
on: { push: { branches: [probe-stand], paths: ['.github/workflows/probe.yml'] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -s 'https://site.api.espn.com/apis/v2/sports/basketball/mens-college-basketball/standings?group=50&level=3' -o probe/m.json
          curl -s 'https://site.api.espn.com/apis/v2/sports/basketball/womens-college-basketball/standings?group=50&level=3' -o probe/w.json
          git config user.name "probe"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -m "probe data"; git push
