name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://www.nba.com/players" "https://www.wnba.com/players"; do
            echo "== $u"; curl -sL -m 30 -A "Mozilla/5.0" "$u" -o o.html -w "%{http_code} %{size_download}\n"
            python3 - <<'PY'
          import re,json
          s=open('o.html',errors='ignore').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',s,re.S)
          print('next', bool(m))
          if m:
            d=json.loads(m.group(1)); t=json.dumps(d)
            i=t.find('PERSON_ID'); print(t[max(0,i-300):i+600])
          else:
            for k in ['PERSON_ID','personId','playerId','headshot']:
              i=s.find(k); print(k,i, s[max(0,i-200):i+300] if i>=0 else '')
          PY
          done
