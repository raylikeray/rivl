name: Probe
on: { push: { branches: [probe-feed] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.mjs <<'JS'
          const S='https://site.api.espn.com/apis/site/v2/sports/basketball/';
          const U=[
            ['mMar3', S+'mens-college-basketball/scoreboard?dates=202503&seasontype=3&groups=50&limit=400'],
            ['mMar3g100', S+'mens-college-basketball/scoreboard?dates=202503&seasontype=3&groups=100&limit=400'],
            ['mApr3', S+'mens-college-basketball/scoreboard?dates=202504&seasontype=3&groups=50&limit=400'],
            ['wMar24', S+'womens-college-basketball/scoreboard?dates=202403&seasontype=3&groups=50&limit=400'],
            ['wApr24', S+'womens-college-basketball/scoreboard?dates=202404&seasontype=3&groups=50&limit=400'],
            ['nbaApr3', S+'nba/scoreboard?dates=202504&seasontype=3&limit=400'],
            ['nbaJun3', S+'nba/scoreboard?dates=202506&seasontype=3&limit=400'],
            ['wnbaSep3', S+'wnba/scoreboard?dates=202509&seasontype=3&limit=400'],
            ['wnbaOct3', S+'wnba/scoreboard?dates=202510&seasontype=3&limit=400'],
            ['m26Mar3', S+'mens-college-basketball/scoreboard?dates=202603&seasontype=3&groups=50&limit=400'],
          ];
          for (const [k,u] of U) {
            try { const r = await fetch(u); const t = await r.text(); if (r.status!==200) console.log(' body:', t.slice(0,300)); const j = JSON.parse(t); const ev = j.events||[];
              console.log(`\n### ${k} status=${r.status} events=${ev.length}`);
              ev.slice(0,1).forEach(e=>{ const c=e.competitions[0];
                console.log(' note:', JSON.stringify((c.notes||[]).map(n=>n.headline)), '| type:', e.season&&e.season.type, e.season&&e.season.slug);
                c.competitors.forEach(x=>console.log('   ', x.team.abbreviation, 'rank', JSON.stringify(x.curatedRank), 'seed', x.seed??'', 'keys', Object.keys(x).join(',')));
                if (c.series) console.log('   series', JSON.stringify(c.series).slice(0,200)); });
              const notes={}; ev.forEach(e=>{const n=(((e.competitions[0].notes||[])[0]||{}).headline||'(none)').replace(/ - Game \\d+/,' - Game N'); notes[n]=(notes[n]||0)+1;});
              console.log(' distinct notes:', Object.keys(notes).length, JSON.stringify(Object.entries(notes).slice(0,40)));
              const ds=ev.map(e=>e.date).sort(); console.log(' span', ds[0], ds[ds.length-1]);
            } catch (e) { console.log(k,'ERR',e.message); }
          }
          JS
          node p.mjs
