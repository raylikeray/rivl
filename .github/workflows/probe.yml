name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for L in nba wnba; do
            D=cdn.$L.com
            curl -sL -m 30 -A "Mozilla/5.0" "https://$D/static/json/staticData/scheduleLeagueV2.json" -o s.json -w "$L sched %{http_code} %{size_download}\n"
            G=$(python3 -c "
          import json;d=json.load(open('s.json'));gs=[g for dd in d['leagueSchedule']['gameDates'] for g in dd['games'] if g.get('gameStatus')==3];print(len(gs),gs[-1]['gameId'] if gs else '')" 2>&1); echo "$G"
            id=$(echo $G | awk '{print $2}')
            curl -sL -m 30 -A "Mozilla/5.0" "https://$D/static/json/liveData/boxscore/boxscore_$id.json" -o b.json -w "box %{http_code} %{size_download}\n"
            python3 -c "import json;d=json.load(open('b.json'))['game'];print([(p['personId'],p['name']) for p in d['homeTeam']['players'][:3]])"
          done
