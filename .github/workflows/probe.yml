name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          q='SELECT ?e ?n WHERE { ?x wdt:P3685 ?e ; wdt:P3647 ?n . }'
          curl -s -G "https://query.wikidata.org/sparql" --data-urlencode "query=$q" -H "Accept: application/sparql-results+json" -A "RIVL/1.0 (personal app)" | python3 -c "import sys,json;b=json.load(sys.stdin)['results']['bindings'];print('nba pairs',len(b),[ (x['e']['value'],x['n']['value']) for x in b[:5]])"
          q='SELECT ?l ?w WHERE { ?x wdt:P3588 ?w ; rdfs:label ?l . FILTER(LANG(?l)="en") } LIMIT 8'
          curl -s -G "https://query.wikidata.org/sparql" --data-urlencode "query=$q" -H "Accept: application/sparql-results+json" -A "RIVL/1.0 (personal app)" | python3 -c "import sys,json;b=json.load(sys.stdin)['results']['bindings'];print([(x['l']['value'],x['w']['value']) for x in b])"
          q='SELECT (COUNT(?x) AS ?c) WHERE { ?x wdt:P3588 ?w }'
          curl -s -G "https://query.wikidata.org/sparql" --data-urlencode "query=$q" -H "Accept: application/sparql-results+json" -A "RIVL/1.0 (personal app)" | head -c 400
