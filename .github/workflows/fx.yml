name: Fixtures
on:
  push:
    paths: ['scripts/fixtures.mjs']
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fixtures.mjs
      - run: |
          git config user.name "RIVL bot"; git config user.email "actions@users.noreply.github.com"
          git add data/fx; git diff --cached --quiet || git commit -m "fixtures"; git pull --rebase -q && git push
