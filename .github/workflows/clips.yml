name: Clips
on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch: {}
concurrency: { group: data-commit }
jobs:
  clips:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/clips.mjs
      - name: Save
        run: |
          git config user.name "rivl-bot"
          git config user.email "bot@rivl"
          git add data/clips.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Clips: update"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break || sleep $((i*5)); done
