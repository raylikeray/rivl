name: Leaders
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/leaders.mjs', '.github/workflows/leaders.yml']
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/leaders.mjs
      - run: |
          git config user.name "RIVL bot"; git config user.email "actions@users.noreply.github.com"
          git add data/leaders.json; git diff --cached --quiet || git commit -m "Leaders: update"; git pull --rebase -q && git push
