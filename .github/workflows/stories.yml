name: Stories
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/stories.mjs, .github/workflows/stories.yml]
concurrency: { group: data-commit }
jobs:
  stories:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/stories.mjs
      - name: Save
        run: |
          git config user.name "rivl-bot"
          git config user.email "bot@rivl"
          git add data/stories.json data/feed.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Stories: update"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break || sleep $((i*5)); done
