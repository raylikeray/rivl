name: Injury log
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/injuries.mjs', '.github/workflows/injuries.yml']
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/injuries.mjs
      - run: |
          git config user.name "RIVL bot"; git config user.email "actions@users.noreply.github.com"
          git add data/; git diff --cached --quiet || git commit -m "Injury log: update"; git pull --rebase -q && git push
