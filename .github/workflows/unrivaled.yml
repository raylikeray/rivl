name: Unrivaled
on:
  schedule:
    - cron: '23 */4 * * *'
    - cron: '*/15 0-6 * 1,2,3 *'   # game nights, Jan to Mar: scores land within minutes
  workflow_dispatch:
  push:
    paths: ['scripts/unrivaled.mjs', '.github/workflows/unrivaled.yml']
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/unrivaled.mjs
      - run: |
          git config user.name "RIVL bot"; git config user.email "actions@users.noreply.github.com"
          git add data/; git diff --cached --quiet || git commit -m "Unrivaled: update"; git pull --rebase -X theirs -q && git push
